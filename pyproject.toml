[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hub-pipeline"
version = "0.1.0"
description = "Repository ingestion and evidence for the AI Hub gateway"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "jinja2>=3.1,<4", "markdown-it-py>=3,<5"]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.site" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
